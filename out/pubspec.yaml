name: upiapp
description: Reconstructed Flutter UPI expense-management app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.0
  uuid: ^4.3.3
  provider: ^6.1.1
  firebase_core: ^2.24.0
  firebase_database: ^10.3.7
  flutter_foreground_task: ^6.1.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
